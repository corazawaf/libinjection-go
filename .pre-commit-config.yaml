repos:
  - repo: https://github.com/tekwizely/pre-commit-golang
    # See 'pre-commit help autoupdate'
    rev: v1.0.0-rc.2
    hooks:
      #
      # Go Build
      #
      - id: go-build-mod
      - id: go-build-pkg
      - id: go-build-repo-mod
      #
      # Go Mod Tidy
      #
      - id: go-mod-tidy
      - id: go-mod-tidy-repo
      #
      # Go Test
      #
      - id: go-test-mod
      - id: go-test-repo-mod
      #
      # Go Vet
      #
      - id: go-vet-pkg
      #
      # Revive
      #
      - id: go-revive-mod
      #
      # GoSec
      #
      - id: go-sec-pkg
      #
      # StaticCheck
      #
      - id: go-staticcheck-pkg
    #
